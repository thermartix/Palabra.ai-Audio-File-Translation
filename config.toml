source_language = "es" # Language spoken in the source video.
target_language = "cs" # Language to synthesize in the translated output.
speech_mode = "voice_id" # "voice_id" for a fixed voice, or "voice_cloning" to use Palabra default/generic timbre voices.
voice_id = "5d65c31a-7443-4b03-9e9c-9f333bea8c52" # Target voice to use when speech_mode = "voice_id".
ffmpeg_path = "ffmpeg" # ffmpeg executable name or full path.
mp4_audio_bitrate = "Auto" # MP4 AAC audio bitrate: "Auto" lets ffmpeg decide; fixed mono options are "64k", "80k", "96k", "128k", or "160k".
alignment_mode = "ffmpeg_segments" # "raw", "inline", or "ffmpeg_segments".
timing_mode = "palabra" # "palabra" uses Palabra's no-drop auto-tempo defaults; override with --timing-mode for one run.
time_stretch_engine = "rubberband" # Local speedup engine for local-rubberband mode; use "ffmpeg_atempo" for FFmpeg's simpler tempo filter.
audio_chunk_ms = 320 # Source audio chunk size sent to Palabra over WebSocket.
output_inactivity_timeout_sec = 10.0 # Stop waiting after this many seconds without returned audio.
auto_tempo = true # Palabra recommends true so its queue can drain before old audio is dropped.
min_tempo = 1.0 # Minimum Palabra TTS tempo multiplier.
max_tempo = 1.45 # Palabra recommended maximum; lower values can let long/fast speech fill the queue.
desired_queue_level_ms = 5000 # Desired translated-speech queue size inside Palabra.
max_queue_level_ms = 20000 # Maximum queue size before Palabra drops older queued audio.
segment_confirmation_silence_threshold = 0.7 # Keep in Palabra's 0.5-0.9s range; lower values can split sentences too early.
sentence_splitter_enabled = true # Allow Palabra to split long sentences into smaller chunks.
pad_segments_to_source_timing = true # Add silence after short translated sections to keep timing closer.
normalize_source_timestamps = true # Compensate for Palabra phrase events arriving later than the original speech.
segment_alignment_strategy = "pad_only" # "pad_only" for Palabra timing mode, or "pad_or_speedup" for local Rubber Band/atempo tests.
segment_max_speedup = 1.45 # Max local tempo increase when segment_alignment_strategy = "pad_or_speedup".
segment_speedup_threshold_sec = 0.15 # Only speed up a segment if it overruns by at least this much.
pad_output_to_input_duration = true # Pad the finished WAV with silence if it ends too early.
trim_output_to_input_duration = false # Trim the finished WAV if it runs longer than the source audio.
write_alignment_debug_json = true # Write .segments.json plus Palabra input sidecars for timing/debug analysis.

# Use this when complete synthesized audio matters more than lowest latency.
# Changing these settings can cause Palabra to split, replace, or partially
# synthesize speech segments unpredictably, which may cause missing words or cut-off audio.

[palabra.presets.complete_audio]
segment_confirmation_silence_threshold = 0.8
only_confirm_by_silence = true
sentence_splitter_enabled = false
translate_partial_transcriptions = false

[palabra.presets.recommended_no_drop]
segment_confirmation_silence_threshold = 0.7
desired_queue_level_ms = 5000
max_queue_level_ms = 20000
auto_tempo = true
min_tempo = 1.0
max_tempo = 1.45

[palabra.presets.local_rubberband]
segment_confirmation_silence_threshold = 0.7
desired_queue_level_ms = 5000
max_queue_level_ms = 20000
auto_tempo = false
min_tempo = 1.0
max_tempo = 1.0
segment_alignment_strategy = "pad_or_speedup"
segment_max_speedup = 1.45
time_stretch_engine = "rubberband"


